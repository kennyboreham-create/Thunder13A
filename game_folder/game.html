<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactics Board Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b1329; touch-action: none; }
        canvas { background-size: cover; background-position: center; touch-action: none; }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col items-center p-4 select-none">

    <div class="max-w-4xl w-full flex justify-between items-center mb-2 shrink-0">
        <div>
            <h1 class="text-xl font-black uppercase text-white tracking-tight">Tactics Simulator</h1>
            <select id="level-selector" onchange="loadSelectedLevel()" class="bg-slate-900 border border-slate-800 text-xs px-3 py-1.5 rounded-xl font-bold mt-1 text-slate-300 outline-none"></select>
        </div>
        <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-center">
            <span class="text-yellow-500 font-black text-sm">★</span>
            <span id="game-status-text" class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Solve Level</span>
        </div>
    </div>

    <div class="relative w-full max-w-4xl bg-slate-950 rounded-2xl border-2 border-slate-800 shadow-2xl overflow-hidden aspect-[1000/600]">
        <canvas id="gameCanvas" width="1000" height="600" class="w-full h-full"></canvas>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyi04VRkZt27UmlfJKFQ9i2t7LvDuWl4-AWEB-hDuzVeQ4X-GYtZ7wk6NFYUG-_mTuj/exec";
        const playerId = localStorage.getItem('hockey_player_id') || "P001"; // Fallback alignment
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let levels = [];
        let activeLevel = null;
        let elements = [];
        let activeDragElement = null;
        let isLevelCleared = false;

        // Audio Pipelines
        const sfxMusic = new Audio('assets/music.mp3'); sfxMusic.loop = true; sfxMusic.volume = 0.3;
        const sfxScore = new Audio('assets/scores.mp3');
        const sfxPenalty = new Audio('assets/penalty.mp3');

        window.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', () => { sfxMusic.play().catch(()=>{}) }, { once: true });
            initGameData();
        });

        async function initGameData() {
            try {
                const response = await fetch(`${API_URL}?action=getLevels`);
                const res = await response.json();
                if (res.success && res.levels.length > 0) {
                    levels = res.levels;
                    const selector = document.getElementById('level-selector');
                    selector.innerHTML = levels.map(l => `<option value="${l.level_id}">${l.title}</option>`).join('');
                    loadSelectedLevel();
                }
            } catch (err) { console.error("Initialization breakdown:", err); }
        }

        function loadSelectedLevel() {
            const lvlId = document.getElementById('level-selector').value;
            activeLevel = levels.find(l => l.level_id === lvlId);
            if (!activeLevel) return;

            canvas.style.backgroundImage = `url('${activeLevel.background_url}')`;
            elements = JSON.parse(JSON.stringify(activeLevel.objects)); // Deep clone objects Array
            isLevelCleared = false;
            document.getElementById('game-status-text').innerText = "Solve Level";
            document.getElementById('game-status-text').className = "text-xs font-bold uppercase tracking-wider text-slate-400 ml-1";
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            elements.forEach(obj => {
                if (obj.name === 'correct') return; // Hide target hitbox coordinates from youth screens

                ctx.save();
                ctx.fillStyle = obj.isPlayer ? '#2563eb' : '#e2e8f0';
                ctx.shadowBlur = 10; ctx.shadowColor = obj.isPlayer ? '#2563eb' : 'transparent';
                
                // Draw Tactical Markers
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, 25, 0, Math.PI * 2);
                ctx.fill();
                
                // Text overlay binding
                ctx.fillStyle = obj.isPlayer ? '#ffffff' : '#0f172a';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(obj.name, obj.x, obj.y);
                ctx.restore();
            });
        }

        // Pointer event standardizations (Touch & Cursor unified coordinate extractions)
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('touchstart', startDrag, { passive: false });

        function startDrag(e) {
            if (isLevelCleared) return;
            e.preventDefault();
            const pos = getCanvasCoordinates(e);
            
            // Prioritize dragging the Player token
            activeDragElement = elements.find(obj => obj.isPlayer && Math.hypot(obj.x - pos.x, obj.y - pos.y) < 30);
            if (!activeDragElement) {
                activeDragElement = elements.find(obj => obj.name !== 'correct' && Math.hypot(obj.x - pos.x, obj.y - pos.y) < 30);
            }
        }

        window.addEventListener('mousemove', handleDrag);
        window.addEventListener('touchmove', handleDrag, { passive: false });

        function handleDrag(e) {
            if (!activeDragElement) return;
            e.preventDefault();
            const pos = getCanvasCoordinates(e);
            
            // Constrain elements within canvas grid dimensions
            activeDragElement.x = Math.max(30, Math.min(pos.x, canvas.width - 30));
            activeDragElement.y = Math.max(30, Math.min(pos.y, canvas.height - 30));
            
            draw();
            checkCollisions();
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function endDrag() { activeDragElement = null; }

        function checkCollisions() {
            const playerToken = elements.find(o => o.isPlayer);
            const targetToken = elements.find(o => o.name === 'correct');
            
            if (!playerToken || !targetToken || isLevelCleared) return;

            const distance = Math.hypot(playerToken.x - targetToken.x, playerToken.y - targetToken.y);
            
            if (distance < 40) { // Collision threshold match reached
                isLevelCleared = true;
                activeDragElement = null;
                triggerSuccessState();
            }
        }

        async function triggerSuccessState() {
            sfxScore.play();
            document.getElementById('game-status-text').innerText = "✓ Cleared";
            document.getElementById('game-status-text').className = "text-xs font-bold uppercase tracking-wider text-emerald-400 ml-1";
            
            try {
                const response = await fetch(`${API_URL}?action=awardGameStar&playerId=${playerId}&levelId=${activeLevel.level_id}`, { method: 'POST' });
                const res = await response.json();
                alert(res.message);
                
                // Communicate directly to parent application dashboard profile view if running inside iframe
                if (window.parent) {
                    window.parent.postMessage({ action: 'refreshStars' }, '*');
                }
            } catch(e) { console.error("Star payout transaction breakdown:", e); }
        }
    </script>
</body>
</html>
