<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hockey Training App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <!-- Login Screen -->
    <div id="login-screen" class="flex flex-col items-center justify-center h-screen">
        <h1 class="text-4xl font-bold mb-6 text-blue-400">Hockey Trainer</h1>
        <input type="text" id="login-id" placeholder="Player ID" class="p-2 mb-2 rounded text-black w-64">
        <input type="password" id="login-pass" placeholder="Password" class="p-2 mb-4 rounded text-black w-64">
        <button onclick="login()" class="bg-blue-600 px-6 py-2 rounded font-bold hover:bg-blue-500 w-64">Login</button>
        <p id="login-msg" class="mt-4 text-red-400 max-w-md text-center whitespace-pre-line"></p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden p-6 max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div class="flex items-center gap-4">
                <div id="player-avatar-container" class="w-16 h-16 rounded-full bg-slate-800 border-2 border-blue-500 overflow-hidden hidden flex items-center justify-center">
                    <img id="player-avatar-img" src="" alt="Avatar" class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 class="text-2xl font-bold" id="player-name">Player Name</h2>
                    <p class="text-sm text-slate-400" id="player-jersey"></p>
                </div>
            </div>
            <div class="text-lg">Stars: <span id="star-count" class="text-yellow-400 font-bold">0</span></div>
        </header>

        <!-- Dynamic Incoming Alerts Banner Panel -->
        <div id="trade-alerts-container" class="mb-6 hidden grid gap-2"></div>

        <!-- Main Navigation Tabs -->
        <div class="flex gap-6 mb-6 border-b border-slate-800 pb-2 text-lg font-medium">
            <button onclick="showMainTab('training')" id="tab-btn-training" class="text-blue-400 border-b-2 border-blue-400 pb-2 px-1">Training</button>
            <button onclick="showMainTab('gameboard')" id="tab-btn-gameboard" class="text-slate-400 hover:text-white pb-2 px-1">Game Board</button>
            <button onclick="showMainTab('store')" id="tab-btn-store" class="text-slate-400 hover:text-white pb-2 px-1">Store</button>
        </div>

        <!-- TRAINING SECTION -->
        <div id="training-section" class="main-section">
            <div class="flex gap-3 mb-6 bg-slate-800 p-1.5 rounded-lg w-fit">
                <button onclick="filterLessons('Strategy')" id="sub-btn-Strategy" class="px-4 py-1.5 rounded bg-blue-600 font-medium text-sm">Strategy</button>
                <button onclick="filterLessons('Workout')" id="sub-btn-Workout" class="px-4 py-1.5 rounded text-slate-400 hover:text-white font-medium text-sm">Workout</button>
                <button onclick="filterLessons('Skills')" id="sub-btn-Skills" class="px-4 py-1.5 rounded text-slate-400 hover:text-white font-medium text-sm">Skills</button>
            </div>
            <div id="lessons-list" class="grid gap-4"></div>
        </div>

        <!-- GAME BOARD SECTION -->
        <div id="gameboard-section" class="main-section hidden">
            <div class="bg-slate-800 rounded-xl p-6 shadow-xl">
                <h3 class="text-xl font-bold mb-4 text-blue-400 flex items-center gap-2">🏆 Team Leaderboard</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400 text-sm">
                                <th class="py-3 px-4 w-16">Rank</th>
                                <th class="py-3 px-4">Player</th>
                                <th class="py-3 px-4 text-center">Jersey</th>
                                <th class="py-3 px-4 text-right">Stars</th>
                                <th class="py-3 px-4 text-center w-28">Action</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="divide-y divide-slate-700/50"></tbody>
                    </table>
                </div>
            </div>
            
            <div class="mt-8">
                <h3 class="text-xl font-bold mb-4">Available Challenges</h3>
                <div id="games-list" class="grid gap-4"></div>
                <div id="playbook-challenge-panel" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl max-w-xl mx-auto my-6 hidden">
    <div class="border-b border-slate-700/60 pb-3 mb-4 flex justify-between items-start">
        <div>
            <span class="bg-blue-500/10 text-blue-400 text-[10px] px-2 py-0.5 rounded-full uppercase font-bold tracking-wider border border-blue-500/20">Weekly Challenge</span>
            <h3 id="pb-scenario-title" class="text-lg font-bold text-slate-100 mt-1">Playbook Canvas Loading...</h3>
            <p id="pb-scenario-desc" class="text-xs text-slate-400 mt-0.5"></p>
        </div>
        <div id="pb-star-reward-chip" class="text-right"></div>
    </div>
    
    <div class="overflow-x-auto w-full flex justify-center py-2">
        <div id="rink-canvas-frame" class="relative w-[600px] h-[350px] bg-slate-950 rounded-xl border border-slate-700 select-none overflow-hidden shadow-inner flex-shrink-0" style="background-image: url('https://images.unsplash.com/photo-1518063319789-7217e6706b04?q=80&w=600&h=350&fit=crop'); background-size: cover; background-position: center;">
            
            <div id="draggable-token-node" class="absolute w-9 h-9 bg-blue-600 text-white font-extrabold rounded-full border-2 border-white flex items-center justify-center cursor-grab active:cursor-grabbing shadow-2xl z-30 select-none hidden" style="left: 0px; top: 0px;">X</div>
            
            <div id="dropzone-target-guide" class="absolute w-10 h-10 border-2 border-dashed border-emerald-400/60 bg-emerald-500/5 rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 hidden" style="left: 0px; top: 0px;"></div>
        </div>
    </div>
    
    <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between items-center gap-4">
        <div id="pb-feedback-feedback" class="text-xs font-semibold text-slate-400"></div>
        <button onclick="evaluatePlaybookPosition()" id="pb-submit-btn" class="bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white font-bold text-xs px-5 py-2.5 rounded-lg transition shadow-md whitespace-nowrap">
            Lock Tactics Position
        </button>
    </div>
</div>
            </div>
        </div>

        <!-- STORE SECTION -->
        <div id="store-section" class="main-section hidden">
            <h3 class="text-xl font-bold mb-4">Sprite Store</h3>
            <div id="store-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <!-- Inventory Inspection Modal Popup -->
    <div id="inventory-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-xl p-6 max-w-md w-full border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 id="modal-player-name" class="text-xl font-bold text-blue-400">Player's Items</h3>
                    <p class="text-xs text-slate-400">Vault Checklist</p>
                </div>
                <button onclick="closeInventoryModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
            </div>
            <div id="modal-inventory-list" class="grid gap-3 max-h-80 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <!-- Trade Offer Selection Drawer Overlay Modal -->
    <div id="trade-select-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-xl p-6 max-w-sm w-full border border-slate-700 shadow-2xl text-center">
            <h3 class="text-lg font-bold text-amber-400 mb-1">Propose a Trade</h3>
            <p class="text-xs text-slate-400 mb-4">Select one of your sprites to offer in exchange:</p>
            <div id="my-trade-options-list" class="grid gap-2 max-h-60 overflow-y-auto mb-6 pr-1"></div>
            <button onclick="closeTradeSelectModal()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs px-4 py-2 rounded-lg transition w-full">Cancel Offer</button>
        </div>
    </div>

    <script>
        // PASTE YOUR LIVE WEB APP URL DEPLOYMENT GOOGLE APPS SCRIPT STRING HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbyi04VRkZt27UmlfJKFQ9i2t7LvDuWl4-AWEB-hDuzVeQ4X-GYtZ7wk6NFYUG-_mTuj/exec";

        let playerData = {};
        let currentPlayerId = "";
        let currentTrainingCategory = "Strategy";

        let activeTradeTargetPlayerId = "";
        let activeTradeTargetSpriteId = "";

        async function login() {
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;
            const msg = document.getElementById('login-msg');
            msg.innerText = "Connecting...";

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: 'login', playerId: id, password: pass })
                });
                const data = await resp.json();

                if (data.success) {
                    currentPlayerId = id.toString().trim();
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    fetchDashboard();
                } else {
                    msg.innerText = data.message || "Invalid credentials.";
                }
            } catch (error) {
                msg.innerText = "Network Error during verification.";
            }
        }

        async function fetchDashboard() {
            try {
                const resp = await fetch(`${API_URL}?action=getDashboard&playerId=${currentPlayerId}`);
                playerData = await resp.json();
                
                if (playerData && playerData.success) {
                    renderDashboard();
                } else {
                    console.error("Failed to fetch player context data structure.");
                }
            } catch (error) {
                console.error("Dashboard engine query error:", error);
            }
        }

        function renderDashboard() {
            // Safe assignment fallbacks to protect layout execution execution loop
            document.getElementById('player-name').innerText = playerData.playerProfile?.name || "Player";
            document.getElementById('player-jersey').innerText = `Jersey #${playerData.playerProfile?.jerseyNumber || '00'}`;
            document.getElementById('star-count').innerText = playerData.playerProfile?.totalStars || 0;

            const activeId = playerData.playerProfile?.activeSpriteId;
            const activeSprite = playerData.storeSprites?.find(s => s.id?.toString() === activeId?.toString());
            
            const avatarContainer = document.getElementById('player-avatar-container');
            const avatarImg = document.getElementById('player-avatar-img');

            if (activeSprite && activeSprite.image_url) {
                avatarImg.src = activeSprite.image_url;
                avatarContainer.classList.remove('hidden');
            } else {
                avatarContainer.classList.add('hidden');
            }

            // Render submodules sequence wraps safely inside catch locks
            try { renderTradeAlerts(); } catch(e) { console.error("Alert module fail", e); }
            try { renderLessonsList(); } catch(e) { console.error("Lessons module fail", e); }
            try { renderGameBoard(); } catch(e) { console.error("GameBoard module fail", e); }
            try { renderStore(); } catch(e) { console.error("Store module fail", e); }
        }

        function renderTradeAlerts() {
            const container = document.getElementById('trade-alerts-container');
            if (!playerData.activeTrades || playerData.activeTrades.length === 0) {
                container.classList.add('hidden');
                return;
            }

            // Make evaluation logic strings clean and trimmed
            const incomingTrades = playerData.activeTrades.filter(t => t.receiver_id?.toString().trim() === currentPlayerId.toString().trim());
            if (!incomingTrades || incomingTrades.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = incomingTrades.map(t => {
                const senderName = (playerData.leaderboard?.find(p => p.id?.toString().trim() === t.sender_id?.toString().trim()) || {name: "Another Player"}).name;
                const giveSprite = (playerData.storeSprites?.find(s => s.id?.toString().trim() === t.offered_sprite_id?.toString().trim()) || {sprite_name: "Default"}).sprite_name;
                const takeSprite = (playerData.storeSprites?.find(s => s.id?.toString().trim() === t.requested_sprite_id?.toString().trim()) || {sprite_name: "Default"}).sprite_name;

                return `
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-md">
                        <div>
                            <p class="text-sm font-bold text-amber-400">🤝 Trade Proposal Received!</p>
                            <p class="text-xs text-slate-200 mt-0.5"><b>${senderName}</b> offers <b>${giveSprite}</b> in exchange for your <b>${takeSprite}</b>.</p>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <button onclick="resolveTrade('${t.id}', 'acceptTrade')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex-1 sm:flex-none">Accept</button>
                            <button onclick="resolveTrade('${t.id}', 'denyTrade')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg transition flex-1 sm:flex-none">Decline</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function resolveTrade(id, actionRoute) {
            await fetch(API_URL, { 
                method: 'POST', 
                body: new URLSearchParams({ action: actionRoute, playerId: currentPlayerId, tradeId: id })
            });
            fetchDashboard();
        }

        function filterLessons(category) {
            currentTrainingCategory = category;
            ['Strategy', 'Workout', 'Skills'].forEach(cat => {
                const btn = document.getElementById(`sub-btn-${cat}`);
                if(cat === category) {
                    btn.classList.add('bg-blue-600');
                    btn.classList.remove('text-slate-400', 'hover:text-white');
                } else {
                    btn.classList.remove('bg-blue-600');
                    btn.classList.add('text-slate-400', 'hover:text-white');
                }
            });
            renderLessonsList();
        }

        function renderLessonsList() {
            const container = document.getElementById('lessons-list');
            if (!playerData.lessons) return;
            
            // 1. Intercept Custom Weekly Workout Checklist Tab
            if (currentTrainingCategory.toLowerCase() === 'workout') {
                renderWeeklyWorkoutSection(container);
                return;
            }

            // 2. Intercept Custom Daily Skills Checklist Tab
            if (currentTrainingCategory.toLowerCase() === 'skills') {
                renderDailySkillsSection(container);
                return;
            }

            // 3. Handling for Strategy Tab (Standard Lessons + Strategy Tests)
            const filtered = playerData.lessons.filter(l => l.category && l.category.toLowerCase().trim() === currentTrainingCategory.toLowerCase());

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-slate-500 italic p-4 text-center bg-slate-800/50 rounded">No ${currentTrainingCategory} items found.</p>`;
                return;
            }

            // Sort standard lessons: Incomplete first, Completed dropped to the bottom
            const sortedLessons = filtered.sort((a, b) => a.completed - b.completed);

            // Build standard lesson HTML elements
            let htmlOutput = sortedLessons.map(l => {
                const videoUrl = l.video_url ? l.video_url.trim() : "";
                return `
                    <div class="p-4 bg-slate-800 border border-slate-700/50 rounded-xl flex justify-between items-center shadow-sm ${l.completed ? 'opacity-60' : ''}">
                        <div>
                            <p class="font-bold ${l.completed ? 'text-slate-400 line-through' : 'text-slate-100'}">${l.title}</p>
                            <p class="text-xs text-yellow-500 font-medium">+${l.star_reward} Stars</p>
                        </div>
                        <div class="flex items-center gap-3">
                        ${l.completed ? 
                            `
                            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-bold border border-emerald-500/20">Completed</span>
                            ${videoUrl !== "" ? `<button onclick="window.open('${videoUrl}', '_blank')" class="text-blue-400 hover:text-blue-300 text-xs underline font-semibold">Watch Again</button>` : ''}
                            ` : 
                            `<button onclick="handleLessonCompletion('${l.id}', '${videoUrl}')" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-1.5 rounded-lg transition">Complete</button>`
                        }
                        </div>
                    </div>
                `;
            }).join('');

            // 4. Append Data-Driven Strategy Tests (only visible on Strategy tab)
            if (currentTrainingCategory.toLowerCase() === 'strategy' && playerData.tests) {
                // Collect unique lesson links mapped inside the test pool
                const linkedLessonIds = [...new Set(playerData.tests.map(t => t.lesson_id))];
                
                linkedLessonIds.forEach(lId => {
                    const correspondingLesson = playerData.lessons.find(l => l.id === lId);
                    const labelText = correspondingLesson ? `${correspondingLesson.title} Test` : "Tactics Quiz Assessment";
                    
                    // Check if user has already solved this test successfully
                    const alreadyPassed = playerData.lessons.find(l => l.id === lId && l.completed);

                    htmlOutput += `
                        <div class="p-4 bg-indigo-950/40 border border-indigo-500/30 rounded-xl flex justify-between items-center shadow-md mt-3 hover:border-indigo-500/50 transition">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="bg-indigo-500/20 text-indigo-300 text-[10px] px-2 py-0.5 rounded uppercase font-bold tracking-wider">Exam Assess</span>
                                    <p class="font-bold text-slate-100">${labelText}</p>
                                </div>
                                <p class="text-xs text-yellow-500 font-medium mt-0.5">+10 Stars <span class="text-slate-400">(Requires 100%)</span></p>
                            </div>
                            <button onclick="openQuizModal('${lId}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-sm">
                                ${alreadyPassed ? "Retry Challenge" : "Take Test"}
                            </button>
                        </div>
                    `;
                });
            }

            container.innerHTML = htmlOutput;
        }

        function renderDailySkillsSection(container) {
            // Locate the dynamic date row reference entry inside the database array
            const skillsLesson = playerData.lessons.find(l => l.id === 'L_DAILY_SKILLS');
            const currentDateLabel = skillsLesson ? skillsLesson.title.toString().trim() : "Today";
            
            const isAlreadyCompleted = skillsLesson && skillsLesson.completed;

            // State A: Routine already turned in for today
            if (isAlreadyCompleted) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-emerald-500/20 rounded-2xl p-8 text-center max-w-md mx-auto shadow-xl">
                        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <h3 class="text-xl font-bold text-slate-100">Daily Skills Done!</h3>
                        <p class="text-sm text-slate-400 mt-2">Repetitions locked in for ${currentDateLabel}. Your stars have been added to your vault. Wake up tomorrow for a fresh list!</p>
                    </div>
                `;
                return;
            }

            // State B: Checklist items to perform
            const skillItems = [
                "50 Shots",
                "100 Stickhandling Touches",
                "10 Rock Paper Scissor Matches"
            ];

            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl max-w-xl mx-auto">
                    <div class="border-b border-slate-700/60 pb-3 mb-4">
                        <h3 class="text-xl font-bold text-blue-400">Daily Skills Tracking</h3>
                        <p class="text-xs text-slate-400 mt-0.5">Earn 1 Star instantly per drill checklist target reached!</p>
                    </div>
                    
                    <div class="grid gap-3 mb-6">
                        ${skillItems.map((sk, index) => `
                            <label class="flex items-center gap-3 p-3 bg-slate-900/60 hover:bg-slate-900 rounded-xl border border-slate-700/40 cursor-pointer select-none transition group">
                                <input type="checkbox" value="1" data-index="${index}" class="skills-checkbox w-5 h-5 rounded border-slate-600 bg-slate-700 text-blue-500 focus:ring-0 focus:ring-offset-0 accent-blue-500">
                                <div class="flex justify-between items-center w-full">
                                    <span class="text-sm font-medium text-slate-200 group-hover:text-white">${sk}</span>
                                    <span class="text-xs font-bold text-yellow-500 bg-yellow-500/10 px-2 py-0.5 rounded border border-yellow-500/20">+1 ⭐️</span>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                    
                    <button onclick="submitDailySkills('${currentDateLabel}')" id="skills-submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/10 text-sm">
                        Submit Daily Progress Report
                    </button>
                </div>
            `;
        }

        async function submitDailySkills(dateLabel) {
            const checkboxes = document.querySelectorAll('.skills-checkbox');
            let totalEarnedStars = 0;
            
            checkboxes.forEach(cb => {
                if (cb.checked) totalEarnedStars++;
            });

            if (totalEarnedStars === 0) {
                alert("Please select at least one tracking step to submit your daily training report!");
                return;
            }

            const submitBtn = document.getElementById('skills-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing Routine Data...";

            try {
                // Generates unique activity lookup identity string: L_DAILY_SKILLS_2026-06-12
                const pseudoActivityId = `L_DAILY_SKILLS_${dateLabel}`;
                
                await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        action: 'completeWorkoutModule', // Reuses the secure workout core backend function
                        playerId: currentPlayerId,
                        starBonus: totalEarnedStars,
                        activityId: pseudoActivityId
                    })
                });
                
                fetchDashboard();
            } catch(e) {
                console.error(e);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Daily Progress Report";
            }
        }

        function renderWeeklyWorkoutSection(container) {
            // 1. Locate the master workout row asset passed down from the database array
            const workoutLesson = playerData.lessons.find(l => l.id === 'L_WEEKLY_WORKOUT');
            
            // 2. Safely clean and normalize the title text string from the sheet cell
            let rawTitle = workoutLesson ? workoutLesson.title.toString().trim() : "";
            
            // 3. Fallback math check: If the sheet passes a raw number like "1", transform it to "Week 1"
            const currentWeekLabel = isNaN(rawTitle) || rawTitle === "" ? (rawTitle || "Weekly Workout") : "Week " + rawTitle;
            
            // 4. Read the completion state processed by the backend engine maps
            const isAlreadyCompleted = workoutLesson && workoutLesson.completed;

            // 5. State Banner A: If the user has already submitted this week's workout routine
            if (isAlreadyCompleted) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-emerald-500/20 rounded-2xl p-8 text-center max-w-md mx-auto shadow-xl">
                        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <h3 class="text-xl font-bold text-slate-100">${currentWeekLabel} Completed!</h3>
                        <p class="text-sm text-slate-400 mt-2">Awesome hustle! Your star rewards are safe inside your vault profile. Come back next Monday for your next challenge session.</p>
                    </div>
                `;
                return;
            }

            // 6. State Banner B: If the player needs to complete their exercises
            const exerciseItems = [
                "20 Pushups",
                "30 Squats",
                "20 Lunges",
                "30 Situps",

        async function gradeAndSubmitQuiz(lessonId) {
            const blocks = document.querySelectorAll('.question-block');
            let totalQuestions = blocks.length;
            let correctCount = 0;
            let allAnswered = true;

            // Direct element scanning rather than relying on shared string IDs
            blocks.forEach((b) => {
                const correctVal = b.getAttribute('data-correct');
                
                // Find ANY checked radio button inside this specific question block container
                const selected = b.querySelector('input[type="radio"]:checked');
                
                if (!selected) {
                    allAnswered = false;
                } else if (selected.value === correctVal) {
                    correctCount++;
                }
            });

            if (!allAnswered) {
                alert("Please answer all questions before submitting!");
                return;
            }

            const scorePct = Math.round((correctCount / totalQuestions) * 100);
            const passed = (scorePct === 100);

            const submitBtn = document.getElementById('quiz-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Evaluating System Logs...";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        action: 'submitTestResult',
                        playerId: currentPlayerId,
                        lessonId: lessonId,
                        score: `${correctCount}/${totalQuestions}`,
                        passed: passed ? "true" : "false"
                    })
                });
                const status = await res.json();
                
                document.getElementById('quiz-modal-overlay').remove();
                
                if (passed) {
                    alert(`🎉 Perfect 100%! Score: ${scorePct}%. ${status.pointsAwarded ? '10 Stars added to your account!' : 'Result recorded (Stars previously claimed).'}`);
                } else {
                    alert(`❌ Review Strategy Patterns! You scored ${scorePct}%. Remember, you need 100% accuracy to earn the 10-star reward bounty. Try again!`);
                }
                
                fetchDashboard();
            } catch(e) {
                console.error(e);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Answers";
            }
        }

let activeChallengeRef = null;
let playbookDragData = { isDragging: false, currentX: 0, currentY: 0, startX: 0, startY: 0 };

function initPlaybookScenarioChallengeEngine() {
    if (!playerData.playbookChallenges || playerData.playbookChallenges.length === 0) {
        document.getElementById('pb-scenario-title').innerText = "No Playbook Scenarios Loaded";
        return;
    }
    
    // Auto-select the first uncompleted challenge, or default to the most recent one
    let target = playerData.playbookChallenges.find(c => !c.completed);
    if (!target) target = playerData.playbookChallenges[playerData.playbookChallenges.length - 1];
    
    activeChallengeRef = target;
    
    // Display metadata text definitions to elements
    document.getElementById('pb-scenario-title').innerText = target.scenario_title;
    document.getElementById('pb-scenario-desc').innerText = target.description;
    document.getElementById('pb-star-reward-chip').innerHTML = `
        <span class="text-xs font-bold text-yellow-500 bg-yellow-500/10 border border-yellow-500/20 px-2.5 py-1 rounded-md inline-block">+${target.star_reward} Stars</span>
    `;
    
    const token = document.getElementById('draggable-token-node');
    const guide = document.getElementById('dropzone-target-guide');
    const feedback = document.getElementById('pb-feedback-feedback');
    const submitBtn = document.getElementById('pb-submit-btn');
    
    token.innerText = target.piece_type || "X";
    feedback.className = "text-xs font-semibold text-slate-400";
    
    if (target.completed) {
        feedback.innerText = "✓ Playbook Challenge Cleared for this week!";
        feedback.classList.add("text-emerald-400");
        submitBtn.disabled = true;
        // Place token directly at final correct destination target coordinate
        setTokenPosition(target.target_x, target.target_y);
        guide.classList.add('hidden');
        removeDragListeners();
    } else {
        feedback.innerText = "Drag the marker piece to the tactical position.";
        submitBtn.disabled = false;
        // Seed initial coordinate configuration cell bounds
        setTokenPosition(target.initial_x, target.initial_y);
        guide.classList.remove('hidden');
        setGuidePosition(target.target_x, target.target_y);
        setupDragAndDropInteractions();
    }
}

function setTokenPosition(x, y) {
    const token = document.getElementById('draggable-token-node');
    playbookDragData.currentX = parseInt(x);
    playbookDragData.currentY = parseInt(y);
    token.style.left = `${playbookDragData.currentX - 18}px`; // Subtract radius offset (half of w-9)
    token.style.top = `${playbookDragData.currentY - 18}px`;
    token.classList.remove('hidden');
}

function setGuidePosition(x, y) {
    const guide = document.getElementById('dropzone-target-guide');
    guide.style.left = `${parseInt(x)}px`;
    guide.style.top = `${parseInt(y)}px`;
}

function setupDragAndDropInteractions() {
    const token = document.getElementById('draggable-token-node');
    
    // Reset any existing listener attachments
    token.onpointerdown = startPlaybookDrag;
}

function removeDragListeners() {
    const token = document.getElementById('draggable-token-node');
    token.onpointerdown = null;
}

function startPlaybookDrag(e) {
    e.preventDefault();
    playbookDragData.isDragging = true;
    
    playbookDragData.startX = e.clientX - playbookDragData.currentX;
    playbookDragData.startY = e.clientY - playbookDragData.currentY;
    
    document.onpointermove = executePlaybookDrag;
    document.onpointerup = stopPlaybookDrag;
}

function executePlaybookDrag(e) {
    if (!playbookDragData.isDragging) return;
    
    const frame = document.getElementById('rink-canvas-frame');
    const rect = frame.getBoundingClientRect();
    
    // Calculate raw mouse tracking placement relative to container constraints
    let computedX = e.clientX - playbookDragData.startX;
    let computedY = e.clientY - playbookDragData.startY;
    
    // Clamp movement boundary limits inside our 600x350 box layout envelope
    playbookDragData.currentX = Math.max(18, Math.min(582, computedX));
    playbookDragData.currentY = Math.max(18, Math.min(332, computedY));
    
    const token = document.getElementById('draggable-token-node');
    token.style.left = `${playbookDragData.currentX - 18}px`;
    token.style.top = `${playbookDragData.currentY - 18}px`;
}

function stopPlaybookDrag() {
    playbookDragData.isDragging = false;
    document.onpointermove = null;
    document.onpointerup = null;
}

async function evaluatePlaybookPosition() {
    if (!activeChallengeRef) return;
    
    // Math Core Step: Calculate distance error vector matrix variance 
    const dx = playbookDragData.currentX - parseInt(activeChallengeRef.target_x);
    const dy = playbookDragData.currentY - parseInt(activeChallengeRef.target_y);
    const absoluteDistance = Math.sqrt(dx * dx + dy * dy);
    
    // Allow an acceptable drop radius threshold (e.g., 30px target window box padding accuracy)
    const passed = absoluteDistance <= 30;
    
    const submitBtn = document.getElementById('pb-submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Locking Alignment Vector...";

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: new URLSearchParams({
                action: 'submitPlaybookChallenge',
                playerId: currentPlayerId,
                challengeId: activeChallengeRef.id,
                passed: passed ? "true" : "false"
            })
        });
        const status = await res.json();
        
        if (passed) {
            alert(`🎉 Tactical Position Cleared! Position confirmed within playbook margin limits. ${status.pointsAwarded ? `Earned +${status.starsEarned} Stars!` : 'Position logged.'}`);
        } else {
            alert(`❌ Out of Alignment! F1 placement leaves the passing channel open or fails breakout lock positioning variables. Readjust and try again!`);
        }
        
        // Reload master data matrices state profiles from sheets API
        await fetchDashboard();
        initPlaybookScenarioChallengeEngine();
    } catch(e) {
        console.error(e);
        submitBtn.disabled = false;
        submitBtn.innerText = "Lock Tactics Position";
    }
}
    </script>
